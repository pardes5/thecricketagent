<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://fwxfrvsmbymcifywdwex.supabase.co; form-action 'self'; base-uri 'self'; object-src 'none'">
    <title>Admin Portal | The Cricket Agent</title>
    <link rel="icon" type="image/jpeg" href="./assets/logo1.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body, input, select, button, textarea { cursor: auto !important; }
        .admin-container { max-width: 800px; margin: 100px auto 40px auto; padding: 0 20px; }
        .admin-card { background: var(--bg-dark-card); border: 1px solid var(--border-dark); padding: 30px; border-radius: 20px; margin-bottom: 30px; }
        .hidden-section { display: none; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-dark); }
        .btn-danger { background: #ff3b30; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
        .admin-select { background: #0f1113; color: #fff; padding: 10px; border-radius: 8px; border: 1px solid #2a2e33; }
        .admin-file { padding: 10px; background: #0f1113; color: #fff; }
        .admin-heading { font-family: var(--font-heading); color: var(--accent-lime); }
        .text-white { color: #fff; }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- LOGIN SECTION -->
        <div id="loginSection" class="admin-card">
            <h2 class="admin-heading" style="font-size: 2.2rem; margin-bottom: 20px;">ADMIN LOGIN</h2>
            <form id="loginForm">
                <div class="form-group mb-3">
                    <label for="loginEmail">Admin Email</label>
                    <input type="email" id="loginEmail" autocomplete="username" required placeholder="Enter your admin email">
                </div>
                <div class="form-group mb-3">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="submit-btn-primary">Login to Dashboard →</button>
            </form>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="hidden-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 class="admin-heading" style="font-size: 2.5rem;">PLAYER MANAGEMENT</h2>
                <button type="button" id="logoutBtn" class="btn-danger">Logout</button>
            </div>

            <!-- ADD NEW PLAYER FORM -->
            <div class="admin-card">
                <h3 class="text-white" style="margin-bottom: 20px;">Add New Player Profile</h3>
                <form id="addPlayerForm">
                    <div class="form-grid-2">
                        <div class="form-group"><label for="pName">Full Name *</label><input type="text" id="pName" required></div>
                        <div class="form-group"><label for="pAge">Age *</label><input type="number" id="pAge" min="1" max="99" required></div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="pRole">Role *</label>
                            <select id="pRole" class="admin-select" required>
                                <option value="Batter">Batter</option>
                                <option value="Bowler">Bowler</option>
                                <option value="All-Rounder">All-Rounder</option>
                                <option value="Wicket-Keeper">Wicket-Keeper</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pEligibility">Eligibility *</label>
                            <select id="pEligibility" class="admin-select" required>
                                <option value="UK Eligible">UK Eligible</option>
                                <option value="Overseas">Overseas</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-group"><label for="pAvailability">Availability *</label><input type="text" id="pAvailability" placeholder="e.g. Immediate" required></div>
                        <div class="form-group"><label for="pKeyStat">Key Summary Stat *</label><input type="text" id="pKeyStat" placeholder="e.g. Batting Avg: 98.45" required></div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-group"><label for="pBattingStyle">Batting Style</label><input type="text" id="pBattingStyle" placeholder="e.g. Right-Hand Bat"></div>
                        <div class="form-group"><label for="pBowlingStyle">Bowling Style</label><input type="text" id="pBowlingStyle" placeholder="e.g. Right-Arm Fast"></div>
                    </div>
                    <div class="form-group mb-3"><label for="pCareer">Career Summary</label><input type="text" id="pCareer" placeholder="e.g. Current: Playing for Club"></div>
                    <div class="form-group mb-3"><label for="pDetailedStats">Detailed Stats</label><input type="text" id="pDetailedStats" placeholder="e.g. Runs: 1,394 | HS: 179*"></div>
                    <div class="form-group mb-3"><label for="pAchievements">Achievements</label><input type="text" id="pAchievements" placeholder="e.g. Player of the Season"></div>
                    <!-- DETAILED STATISTICS FOR POPUP TABLE -->
                    <h4 class="text-white" style="margin-top: 30px; margin-bottom: 15px; border-bottom: 1px solid var(--border-dark); padding-bottom: 10px;">Official Statistics (For Popup Table)</h4>
                    
                    <div class="form-group mb-3">
                        <label for="pStatTeam">Team (Season) *</label>
                        <input type="text" id="pStatTeam" placeholder="e.g. Rochdale (2023)" required>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group"><label for="pStatMts">Mts (Matches)</label><input type="text" id="pStatMts"></div>
                        <div class="form-group"><label for="pStatInns">Inns (Innings)</label><input type="text" id="pStatInns"></div>
                        <div class="form-group"><label for="pStatNO">NO (Not Outs)</label><input type="text" id="pStatNO"></div>
                        <div class="form-group"><label for="pStatRuns">Runs</label><input type="text" id="pStatRuns"></div>
                        <div class="form-group"><label for="pStatHS">HS (Highest Score)</label><input type="text" id="pStatHS"></div>
                        <div class="form-group"><label for="pStatBatAve">Ave (Batting Average)</label><input type="text" id="pStatBatAve"></div>
                    </div>

                    <div class="form-grid-2 mt-3">
                        <div class="form-group"><label for="pStatOvs">Ovs (Overs)</label><input type="text" id="pStatOvs"></div>
                        <div class="form-group"><label for="pStatBowlRuns">Runs (Conceded)</label><input type="text" id="pStatBowlRuns"></div>
                        <div class="form-group"><label for="pStatWkts">Wkts (Wickets)</label><input type="text" id="pStatWkts"></div>
                        <div class="form-group"><label for="pStatBB">BB (Best Bowling)</label><input type="text" id="pStatBB"></div>
                        <div class="form-group"><label for="pStatBowlAvg">Avg (Bowling Average)</label><input type="text" id="pStatBowlAvg"></div>
                    </div>
                    <div class="form-group mb-4">
                        <label for="pPhotoFile">Player Photo * <span class="label-hint">(JPG, PNG, WEBP or GIF, max 5 MB)</span></label>
                        <input type="file" id="pPhotoFile" accept="image/jpeg,image/png,image/webp,image/gif" required class="admin-file">
                    </div>

                    <button type="submit" id="submitBtn" class="submit-btn-primary">Publish Player to Live Website ✈️</button>
                </form>
            </div>

            <!-- ROSTER -->
            <div class="admin-card">
                <h3 class="text-white" style="margin-bottom: 15px;">Live Roster Management</h3>
                <div id="adminPlayersList" style="color: #9aa0a6;">Loading roster...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="admin.js" defer></script>
</body>
</html>
